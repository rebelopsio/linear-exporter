name: Validate Build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build binary locally
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s" \
            -a -installsuffix cgo \
            -o linear-exporter ./cmd/exporter/

      - name: Check binary size
        run: |
          SIZE=$(stat -f%z linear-exporter 2>/dev/null || stat -c%s linear-exporter 2>/dev/null)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 50 ]; then
            echo "⚠️ Warning: Binary size is ${SIZE_MB}MB (expected <50MB)"
            exit 1
          fi
          echo "✓ Binary size check passed"

      - name: Verify binary runs
        env:
          LINEAR_API_KEY: "test_key"
        run: |
          timeout 3s ./linear-exporter || true
          echo "✓ Binary execution check passed"
